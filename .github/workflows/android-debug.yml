name: Android Debug APK

# Build debug APK for relevant main-branch changes; never publish to a store.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-debug.yml"
      - "scripts/android-dev.mjs"
      - "scripts/prepare-mobile-assets.mjs"
      - "scripts/prepare-offline-books.py"
      - "scripts/split-android-apk.py"
      - "scripts/prepare-android-fonts.mjs"
      - "scripts/prepare-offline-mushaf.py"
      - "scripts/mobile-integrity.mjs"
      - "scripts/verify-mobile-bundle.mjs"
      - "src/**"
      - "mobile/**"
      - "public/audio/wird/**"
      - "vite.mobile.config.ts"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-debug.yml"
      - "scripts/android-dev.mjs"
      - "scripts/prepare-mobile-assets.mjs"
      - "scripts/prepare-offline-books.py"
      - "scripts/split-android-apk.py"
      - "scripts/prepare-android-fonts.mjs"
      - "scripts/prepare-offline-mushaf.py"
      - "scripts/mobile-integrity.mjs"
      - "scripts/verify-mobile-bundle.mjs"
      - "src/**"
      - "mobile/**"
      - "public/audio/wird/**"
      - "vite.mobile.config.ts"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Check out approved source images from immutable commit
        uses: actions/checkout@v4
        with:
          ref: 0b944b349fd28295803a0a96fbf2906a14286245
          path: _verified-mushaf-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub-hosted Ubuntu already ships the Android command-line tools.
      # setup-android@v3 currently attempts to install the obsolete SDK
      # package "tools", which fails before Gradle can start.
      - name: Install Android SDK using hosted command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDK_MANAGER" || { echo "sdkmanager is missing"; exit 1; }
          echo "Android SDK root: $SDK_ROOT"
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Cache pinned Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-rihab-gradle-wrapper-8.14.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Quran and media validation logic
        run: bun run test:integrity
      - name: Install strictly lossless Mushaf image optimizer
        run: python -m pip install Pillow==11.3.0
      - name: Install offline PDF book renderer
        run: python -m pip install PyMuPDF==1.26.5
      - name: Download and validate premium Arabic fonts for offline Android
        run: node scripts/prepare-android-fonts.mjs
      - name: Verify and embed all 604 losslessly optimized Quran pages
        run: python scripts/prepare-offline-mushaf.py _verified-mushaf-source mobile/.public/printed-mushaf
      - name: Verify Quran independent source before Android debug build
        run: node scripts/verify-quran-independent-reference.mjs --export-github-env
      # The mobile project is prepared once. Network retries must not re-render
      # the Quran or offline books or bypass integrity checks.
      - name: Generate Android project and verified mobile assets
        run: bun run mobile:android:setup
        env:
          CONTENT_ASSET_ORIGIN: https://sufi-whispers.lovable.app
      - name: Assemble debug APK (retry transient Gradle download errors only)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/rihab-gradle-debug-attempt-$attempt.log"
            echo "Gradle debug attempt $attempt / 3"
            if (cd android && ./gradlew --no-daemon assembleDebug) 2>&1 | tee "$log"; then
              exit 0
            fi
            if [ "$attempt" -ge 3 ] || ! grep -Eqi '(HTTP response code: (429|50[0-4])|HTTPError: Response code (429|50[0-4])|Read timed out|Connection reset|ECONNRESET|ETIMEDOUT)' "$log"; then
              echo "::error::Gradle failed for a non-transient reason or download retry limit reached."
              exit 1
            fi
            echo "::warning::Transient Gradle download failure, retrying Gradle only."
            sleep "$((15 * attempt))"
          done
      # The complete APK is too large to transfer through some connectors.
      # Five verified chunks permit reassembly with the exact APK SHA-256.
      - name: Verify official association launcher icon inside compiled Android APK
        run: python scripts/verify-android-launcher-icons.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Audit compiled APK permissions, target SDK and debug certificate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          python scripts/audit-android-apk.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            debug \
            "$SDK_ROOT/build-tools/36.0.0/aapt" \
            "$SDK_ROOT/build-tools/36.0.0/apksigner" \
            android/apk-security-report.json
      - name: Publish readable APK permission and signature audit
        uses: actions/upload-artifact@v4
        with:
          name: rihab-android-security-report
          path: android/apk-security-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate Android APK and prepare five download-sized pieces
        run: python scripts/split-android-apk.py android/app/build/outputs/apk/debug/app-debug.apk android/apk-parts
      - name: Upload unsigned-for-distribution debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rihab-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone APK part 01
        uses: actions/upload-artifact@v4
        with:
          name: rihab-apk-part-01
          path: |
            android/apk-parts/part-01
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone APK part 02
        uses: actions/upload-artifact@v4
        with:
          name: rihab-apk-part-02
          path: |
            android/apk-parts/part-02
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone APK part 03
        uses: actions/upload-artifact@v4
        with:
          name: rihab-apk-part-03
          path: |
            android/apk-parts/part-03
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone APK part 04
        uses: actions/upload-artifact@v4
        with:
          name: rihab-apk-part-04
          path: |
            android/apk-parts/part-04
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone APK part 05
        uses: actions/upload-artifact@v4
        with:
          name: rihab-apk-part-05
          path: |
            android/apk-parts/part-05
            android/apk-parts/manifest.json
          if-no-files-found: error
          retention-days: 7
