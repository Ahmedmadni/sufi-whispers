name: Android Debug APK

# Manual workflow: never publish an untested package automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Quran and media validation logic
        run: bun run test:integrity
      - name: Generate Android project and build debug APK
        run: bun run mobile:android:apk
        env:
          CONTENT_ASSET_ORIGIN: https://sufi-whispers.lovable.app
          QURAN_EXPECTED_SHA256: ${{ secrets.QURAN_EXPECTED_SHA256 }}
      - name: Upload unsigned-for-distribution debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rihab-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
