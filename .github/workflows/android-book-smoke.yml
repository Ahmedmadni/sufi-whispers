name: Android book reader runtime smoke
# Unlike unit tests, opens the built Android web bundle in Chromium and
# verifies EVERY book route on both a phone viewport and landscape tablet.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "mobile/**"
      - "scripts/smoke-mobile-books.mjs"
      - ".github/workflows/android-book-smoke.yml"
      - "vite.mobile.config.ts"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "mobile/**"
      - "scripts/smoke-mobile-books.mjs"
      - ".github/workflows/android-book-smoke.yml"
      - "vite.mobile.config.ts"
      - "package.json"
      - "bun.lock"
permissions:
  contents: read
jobs:
  mobile-reader:
    name: Eight book routes in real mobile Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check out immutable verified Quran page originals
        uses: actions/checkout@v4
        with:
          ref: 0b944b349fd28295803a0a96fbf2906a14286245
          path: _verified-mushaf-source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install immutable application dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned local image and PDF renderers
        run: python -m pip install Pillow==11.3.0 PyMuPDF==1.26.5
      - name: Prepare verified offline fonts and Quran pages
        run: |
          node scripts/prepare-android-fonts.mjs
          python scripts/prepare-offline-mushaf.py _verified-mushaf-source mobile/.public/printed-mushaf
      - name: Build the exact offline Android web UI
        run: bun run mobile:build
        env:
          CONTENT_ASSET_ORIGIN: https://sufi-whispers.lovable.app
      - name: Install browser automation without modifying app lockfile
        run: |
          npm install --prefix "$RUNNER_TEMP/rihab-browser-tools" --no-audit --no-fund --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Reproduce all books on a portrait phone and landscape tablet
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::A Chromium/Chrome binary is required to test the actual reader."
            exit 1
          fi
          RIHAB_BROWSER_TOOLS="$RUNNER_TEMP/rihab-browser-tools" CHROME_BIN="$CHROME_BIN" node scripts/smoke-mobile-books.mjs
      - name: Upload screenshots from failed book routes
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rihab-mobile-books-failures
          path: mobile-book-smoke-results/
          if-no-files-found: ignore
          retention-days: 7
