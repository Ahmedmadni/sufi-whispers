name: Web Preview Smoke

# Detect real SSR/preview failures that TypeScript and optimized builds miss.
# Release publisher requires this smoke check on the EXACT Android signing SHA.
# Run on every main push / PR, including Android-only or workflow changes,
# otherwise an already-vetted APK can never be published.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    name: SSR preview HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start preview and visit key pages
        run: node scripts/smoke-web-preview.mjs
        env:
          TZ: Asia/Riyadh
      - name: Verify public original Mushaf PNG pages
        run: node scripts/smoke-printed-image-cdn.mjs
