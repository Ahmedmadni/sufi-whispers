name: Inspect original Khaliliya Nafahat book
on:
  push:
    branches: [feat/nafahat-poem-index-hybrid-theme-hero]
    paths: [".github/workflows/inspect-nafahat-khaliliyya.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.5
      - name: Retrieve and inspect original PDF without modifications
        env:
          SOURCE: https://sufi-whispers.lovable.app/__l5e/assets-v1/4436c37b-0857-40c5-be9d-959d95be3bf7/nafahat-khaliliyya.pdf
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rihab-index
          curl -fSL --max-time 120 "$SOURCE" -o /tmp/rihab-index/nafahat-khaliliyya.pdf
          python - <<'PY'
          import fitz,hashlib
          data=open('/tmp/rihab-index/nafahat-khaliliyya.pdf','rb').read()
          assert data.startswith(b'%PDF-') and len(data)==8242344
          doc=fitz.open(stream=data,filetype='pdf')
          print('SOURCE SHA256',hashlib.sha256(data).hexdigest(),'PAGES',doc.page_count)
          toc=doc.get_toc()
          print('PDF OUTLINE TOTAL',len(toc))
          for row in toc[:250]: print('BOOKMARK',repr(row))
          for i,page in enumerate(doc):
            words=page.get_text('words')
            text=page.get_text('text').strip()
            if i<25 or i>doc.page_count-12:
              print('PAGE',i+1,'chars',len(text),'words',len(words),'TEXT',repr(text[:850]))
          PY
      - name: Upload immutable source for accurate local page inspection
        uses: actions/upload-artifact@v4
        with:
          name: nafahat-original-pdf-reference
          path: /tmp/rihab-index/nafahat-khaliliyya.pdf
          retention-days: 1
          if-no-files-found: error
