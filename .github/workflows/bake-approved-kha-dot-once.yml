name: Bake approved Rihab Sheikh kha dot into image (one time)

on:
  push:
    branches:
      - fix/rihab-bake-kha-into-poster-2026-11-15

permissions:
  contents: write

jobs:
  bake-corrected-source:
    if: github.repository == 'Ahmedmadni/sufi-whispers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch to patch the actual WebP image
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add pinned lossless image support
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Apply the exact approved khāʾ point and save lossless WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          path=Path("src/assets/rihab-approved-full-mobile-poster.webp")
          image=Image.open(path).convert("RGBA")
          assert image.size == (941, 1672), "Poster geometry changed; abort"
          # This precisely matches the pixel correction approved by the owner.
          factor=4
          box=(565, 1287, 603, 1321)
          clip=image.crop(box).resize(((box[2]-box[0])*factor, (box[3]-box[1])*factor), Image.Resampling.BICUBIC)
          layer=Image.new("RGBA", clip.size, (0,0,0,0))
          painter=ImageDraw.Draw(layer)
          cx=(585.5-box[0])*factor
          cy=(1303-box[1])*factor
          dx=5.1*factor
          dy=5.4*factor
          diamond=[(cx,cy-dy),(cx+dx,cy),(cx,cy+dy),(cx-dx,cy)]
          shadow=[(x+1.2*factor,y+1.3*factor) for x,y in diamond]
          painter.polygon(shadow, fill=(0,16,14,105))
          painter.polygon(diamond, fill=(252,250,248,255))
          painter.line(diamond+[diamond[0]], fill=(220,219,215,150), width=1*factor)
          clip=Image.alpha_composite(clip,layer).resize((box[2]-box[0],box[3]-box[1]),Image.Resampling.LANCZOS)
          image.paste(clip,box[:2])
          # Only the small correction region differs from the original image.
          # Lossless avoids introducing new artefacts into the Sheikh's face.
          image.convert("RGB").save(path, format="WEBP", lossless=True, method=6)
          assert Image.open(path).size == (941, 1672)
          print("Baked approved Arabic kha dot into the actual WebP asset:",path.stat().st_size,"bytes")
          PY
          sha256sum src/assets/rihab-approved-full-mobile-poster.webp
      - name: Commit the corrected WebP and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bake-approved-kha-dot-once.yml
          git add src/assets/rihab-approved-full-mobile-poster.webp
          git diff --cached --stat
          git commit -m "assets(hero): bake approved single kha dot into lossless mobile poster"
          git push origin HEAD:refs/heads/fix/rihab-bake-kha-into-poster-2026-11-15
