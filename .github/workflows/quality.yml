name: Quality checks

on:
  push:
    branches:
      - main
      - feature/android-readiness
  pull_request:
    branches:
      - main

jobs:
  runner-smoke:
    name: runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check GitHub-hosted runner
        run: echo "GitHub Actions runner started successfully"
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        command: [test, typecheck, build, test:integrity]
    name: quality (${{ matrix.command }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install packages
        run: bun install --frozen-lockfile
      - name: Run ${{ matrix.command }}
        run: bun run ${{ matrix.command }}
        env:
          TZ: Asia/Riyadh

  signing-vault-security:
    name: production signing vault security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned encryption dependency
        run: python -m pip install cryptography==46.0.4
      - name: Test real keystore cryptography, alias and tamper refusal
        run: python -m unittest discover -s tests -p 'test_signing_vault.py' -v
      - name: Verify project backup archive exclusions and tamper refusal
        run: python -m unittest discover -s tests -p 'test_cloud_backup.py' -v
      - name: Inspect Madih source PDF's actual printed TOC
        run: |
          python -m pip install PyMuPDF==1.26.5
          python scripts/probe-nafahat-index.py
          python scripts/generate-nafahat-index.py
