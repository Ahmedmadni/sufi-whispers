name: Quality checks

on:
  push:
    branches:
      - main
      - feature/android-readiness
  pull_request:
    branches:
      - main

jobs:
  runner-smoke:
    name: runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check GitHub-hosted runner
        run: echo "GitHub Actions runner started successfully"
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        command: [test, typecheck, build]
    name: quality (${{ matrix.command }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install packages
        run: bun install --frozen-lockfile
      - name: Run ${{ matrix.command }}
        run: bun run ${{ matrix.command }}
        env:
          TZ: Asia/Riyadh
