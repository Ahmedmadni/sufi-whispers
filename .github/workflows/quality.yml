name: Quality checks

on:
  push:
    branches:
      - main
      - feature/android-readiness
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install packages
        run: bun install --frozen-lockfile
      - name: Regression tests
        run: bun run test
        env:
          TZ: Asia/Riyadh
      - name: TypeScript
        run: bun run typecheck
      - name: Production build
        run: bun run build
