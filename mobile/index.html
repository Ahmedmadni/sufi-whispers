<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101D1A" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/icon-192.png" />
    <!-- Fetch the packaged official Hafs typeface before first Quran paint. -->
    <link rel="preload" href="/mobile-assets/uthmanic_hafs_v20.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    <title>رحاب الخليلية</title>
    <script>
      try {
        document.documentElement.classList.add(localStorage.getItem("rihab-theme") || "dark");
      } catch (_) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
